<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agathos Admin — Disbursement Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/finance-admin.css">
<style>
  /* Disbursement Report, was Summary Payout Report (sheet "Agathos Financial Reports", section 2: "we will use this"):
     one payout period, Master model only, grouped by project; what Finance acts on for the disbursement */
  table.ct.fin-t.pay-t tfoot td{background:#FAFAFA;border-top:1px solid var(--split);font-weight:600;}
  table.ct.fin-t.pay-t tfoot td:first-child{background:#FAFAFA;}
  table.ct.fin-t.pay-t td.key{font-weight:600;}
  .fin-cas.ends-key{padding-bottom:0;}
</style>
</head>
<body>

<div id="shell"></div>
<div class="toast" id="toast"></div>

<script src="assets/shell.js"></script>
<script src="assets/finance-data.js"></script>
<script>
(function(){
  'use strict';
  var CONTENT = mountShell('finance-payouts');
  var F = FIN, C = F.cents, h = F.h;

  var SVG = function(p, s){ return '<svg width="'+(s||16)+'" height="'+(s||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'; };
  var IC = {
    down: SVG('<path d="M6 9l6 6 6-6"/>', 14), cal: SVG('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>', 15),
    check: SVG('<path d="M4.5 12.5l5 5L19.5 7"/>', 16), dl: SVG('<path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/>', 15),
    search: SVG('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>', 15), filter: SVG('<path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z"/>', 20)
  };

  /* every transaction in an uploaded PSP file on the Master model only: the funds Agathos itself disburses to PO/EOs (S1).
     Stripe Connect pays the owner directly and AXS pays the charity, so neither shows here */
  var ALL = [];
  Object.keys(F.PROJECTS).forEach(function(id){
    if(F.PROJECTS[id].model !== 'master') return;
    F.rowsOf(id).forEach(function(r){ if(F.reconciled(r)) ALL.push(F.adminRow(r)); });
  });
  var PERIODS = F.MONTHS.filter(function(m){ return ALL.some(function(a){ return a.r.per === m; }); });
  var LATEST = PERIODS[PERIODS.length - 1];
  var PSPS = [['','All'],['stripe','Stripe'],['2c2p','2c2p']];   /* AXS left out for now (S3) */

  /* f: the filters as picked; shown: the filters of the numbers on screen. Nothing shows before Show report (S2).
     After that, each filter change loads the report by itself, behind a "Loading data…" overlay (admin review 14/11/2026) */
  function defaults(){ return { per:LATEST, psp:'' }; }
  var V = { f:defaults(), shown:null, open:false, fold:{} };
  function stale(){ return !!V.shown && (V.shown.per !== V.f.per || V.shown.psp !== V.f.psp); }
  /* the load waits 1 s after the last change, as a call to the server would */
  var LOAD_MS = 1000, loadT = null;
  function busy(){ return loadT !== null; }
  function load(){
    clearTimeout(loadT);
    loadT = setTimeout(function(){ loadT = null; V.shown = {per:V.f.per, psp:V.f.psp}; renderBody(); markBusy(); }, LOAD_MS);
    markBusy();
  }
  /* a filter change: nothing loads before the first Show report */
  function changed(){ if(V.shown && (busy() || stale())) load(); }

  function plural(n, one){ return n + ' ' + one + (n === 1 ? '' : 's'); }
  function slice(f){ return ALL.filter(function(a){ return a.r.per === f.per && (!f.psp || a.r.p.psp === f.psp); }); }
  /* the summary in whole cents, as the team's table (admin review 14/11/2026): Total Transactions Amount − PSP fees
     − Other PSP charges = Total PSP payout to Agathos; − Final amount to Agathos = Total disbursed to Projects/Events.
     first, last: the dates of the first and last transaction in this payout */
  function sum(list){
    var c = {gross:0, fees:0, final:0}, days = list.map(function(a){ return a.r.day; }).sort();
    list.forEach(function(a){ c.gross += C(a.gross); c.fees += C(a.fees) + C(a.feeGift); c.final += C(a.final); });
    var o = F.otherCharges(list), oc = C(o.total), payout = c.gross - c.fees - oc, final = c.final - oc;
    return {n:list.length, gross:c.gross/100, fees:c.fees/100, other:o, payout:payout/100, final:final/100, merchant:(payout - final)/100,
      first:days[0], last:days[days.length - 1]};
  }
  /* "1 Oct – 25 Oct 2026", the year once when both dates share it */
  function dateRange(a, b){
    if(!a) return '—';
    var x = F.fmtDate(a), y = F.fmtDate(b);
    return x === y ? x : x.slice(-4) === y.slice(-4) ? x.slice(0, -5) + ' – ' + y : x + ' – ' + y;
  }
  /* the detail columns (C52–C59), one row per project or event */
  function byProject(list){
    var g = {}, order = [];
    list.forEach(function(a){
      var id = a.r.p.id;
      if(!g[id]){ g[id] = {p:a.r.p, n:0, gross:0, fees:0, ag:0, net:0}; order.push(id); }
      var x = g[id]; x.n++; x.gross += C(a.gross); x.fees += C(a.fees) + C(a.feeGift); x.ag += C(a.toAgathos); x.net += C(a.net);
    });
    return order.map(function(id){ return g[id]; }).sort(function(a, b){ return b.net - a.net; });
  }

  /* ---------- filters: Payout period, then PSP (S2); the export follows them, so it sits here too (S10) ---------- */
  function panel(){
    var f = V.f, canCsv = V.shown && !busy();
    return '<section class="card fin-panel" aria-label="Filters"><div class="fin-fields">'
      + '<div class="fin-f period"><span class="lbl" id="l-per">Payout period</span><div class="fin-anchor">'
      +   '<button class="fin-trig" type="button" data-act="openPeriod" aria-haspopup="listbox" aria-expanded="' + V.open + '" aria-labelledby="l-per">'
      +     '<span class="ic">' + IC.cal + '</span><span class="v">' + F.payoutLabel(f.per) + '</span><span class="ic">' + IC.down + '</span></button>'
      +   '<div class="fin-pop"' + (V.open ? '' : ' hidden') + '><div class="fin-menu" role="listbox" aria-labelledby="l-per">' + PERIODS.slice().reverse().map(function(m){
            var on = m === f.per, n = ALL.filter(function(a){ return a.r.per === m && (!f.psp || a.r.p.psp === f.psp); }).length;
            return '<button type="button" role="option" aria-selected="' + on + '" data-act="period" data-v="' + m + '"' + (on ? ' class="on"' : '') + '>' + IC.check + F.payoutLabel(m) + '<small>' + plural(n, 'transaction') + '</small></button>';
          }).join('') + '</div></div>'
      + '</div></div>'
      + '<div class="fin-f"><span class="lbl" id="l-psp">PSP</span><div class="fin-seg" role="group" aria-labelledby="l-psp">' + PSPS.map(function(o){
          return '<button type="button" data-act="psp" data-v="' + o[0] + '" aria-pressed="' + (f.psp === o[0]) + '"' + (f.psp === o[0] ? ' class="on"' : '') + '>' + o[1] + '</button>';
        }).join('') + '</div></div>'
      + '</div><div class="fin-panel-foot">'
      +   '<button class="btn" type="button" data-act="csv"' + (canCsv ? '' : ' disabled') + '>' + IC.dl + 'Export .csv</button><span class="sp"></span>'
      +   '<button class="btn" type="button" data-act="reset">Reset</button>'
      +   '<button class="btn primary" type="button" data-act="show">' + IC.search + 'Show report</button>'
      + '</div></section>';
  }

  /* ---------- summary as a cascade, as the team's table (admin review 14/11/2026). Two sizes only: the three bold,
     coloured lines are large, the rest small; each amount in the font of its label. The Other PSP charges fold stays ---------- */
  function row(cls, op, label, value, sub){
    return '<div class="fin-r ' + cls + '"><i class="op" aria-hidden="true">' + op + '</i><span class="nm">' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span><span class="v">' + value + '</span></div>';
  }
  function fold(id, label){ return '<button type="button" class="fin-fold" data-act="fold" data-v="' + id + '" aria-expanded="' + !!V.fold[id] + '" aria-controls="fold-' + id + '">' + label + IC.down + '</button>'; }
  function summary(s){
    var o = s.other, m = F.money, per = V.shown.per;
    return '<section class="card fin-cas ends-key" aria-labelledby="cas-t"><h2 class="sr" id="cas-t">Summary</h2>'
      + '<div class="fin-cas-meta"><span>Payout Period<b>' + F.payoutLabel(per) + '</b></span>'
      /* the first and last transaction in this payout (admin review 14/11/2026) */
      +   '<span>Transaction dates<b>' + dateRange(s.first, s.last) + '</b></span>'
      +   '<span>Agathos to PO/EO disbursement date<b>' + (s.n ? F.fmtDate(F.payoutDate(per)) : '—') + '</b></span></div>'
      + row('l key', '', 'Total Transactions Amount', m(s.gross), '<span>(excluding amounts paid directly to Projects/Events by Stripe Connect model)</span><span>' + plural(s.n, 'transaction') + '</span>')
      + row('s', '−', 'Total PSP transactions fees', m(s.fees))
      + row('s' + (V.fold.other ? ' joined' : ''), '−', fold('other', 'Other PSP charges'), m(o.total))
      + '<ul class="fin-sub" id="fold-other"' + (V.fold.other ? '' : ' hidden') + '><li><span>Account Volume Billing</span><b>' + m(o.volume) + '</b></li><li><span>Active Account Billing</span><b>' + m(o.active) + '</b></li><li><span>Payout Fee</span><b>' + m(o.payout) + '</b></li></ul>'
      + row('l key', '=', 'Total PSP payout to Agathos', m(s.payout))
      + row('s', '−', 'Final amount to Agathos', m(s.final))
      + row('l key last', '=', 'Total disbursed to Projects/Events', m(s.merchant), 'How much to disburse to each PO/EO: see the table below')
      + '</section>';
  }

  /* ---------- by project ---------- */
  function table(list){
    var rows = byProject(list), n = F.num;
    var tot = rows.reduce(function(t, x){ t.gross += x.gross; t.fees += x.fees; t.ag += x.ag; t.net += x.net; return t; }, {gross:0, fees:0, ag:0, net:0});
    var head = '<tr><th>Project/Event</th><th class="r">Total Trx Amt</th><th class="r">Total PSP trx Fees</th><th class="r">Total Net to Agathos</th><th class="r" title="How much to disburse to each PO/EO">Total Net to Merchant</th></tr>';
    var body = rows.map(function(x){
      var p = x.p;
      return '<tr><td><span class="tname">' + h(p.name) + '</span><span class="sub">' + h(F.ENTITIES[p.ent].name) + ' · ' + F.PSP_NAME[p.psp] + ' ' + F.MODEL_NAME[p.model] + ' · ' + plural(x.n, 'transaction') + '</span></td>'
        + '<td class="num r">' + n(x.gross / 100) + '</td><td class="num r">' + n(x.fees / 100) + '</td><td class="num r">' + n(x.ag / 100) + '</td><td class="num r key">' + n(x.net / 100) + '</td></tr>';
    }).join('');
    var foot = '<tr><td>Total</td><td class="num r">' + n(tot.gross / 100) + '</td><td class="num r">' + n(tot.fees / 100) + '</td><td class="num r">' + n(tot.ag / 100) + '</td><td class="num r">' + n(tot.net / 100) + '</td></tr>';
    return '<section class="card fin-tx" aria-labelledby="pay-t"><div class="fin-tx-head"><h2 id="pay-t">By project</h2><span class="n">' + rows.length + '</span></div>'
      + (rows.length
          ? '<div class="tablewrap"><table class="ct fin-t pay-t"><thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>'
          : '<div class="tablewrap"><div class="fin-empty">No Master model transactions for this PSP in this payout period.</div></div>')
      + '</section>';
  }

  /* ---------- CSV with everything on the page (admin review 14/11/2026), in three parts: the report, the summary
     with its signs and the Other PSP charges lines, then one line per project with a Total line ---------- */
  function exportCSV(){
    if(!V.shown || busy()) return;
    var f = V.shown, list = slice(f), s = sum(list), rows = byProject(list), o = s.other, esc = function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var amt = function(v){ return v.toFixed(2); };
    var report = [['Disbursement Report'], ['Payout Period', F.payoutLabel(f.per)], ['First transaction', s.first || ''], ['Last transaction', s.last || ''],
      ['Agathos to PO/EO disbursement date', s.n ? F.payoutDate(f.per) : ''], ['PSP', f.psp ? F.PSP_NAME[f.psp] : 'All'], ['Model', 'Master'], ['Exported', F.TODAY]];
    var summary = [['Summary'], ['', 'Total Transactions Amount (excluding amounts paid directly to Projects/Events by Stripe Connect model)', amt(s.gross)],
      ['-', 'Total PSP transactions fees', amt(s.fees)], ['-', 'Other PSP charges', amt(o.total)],
      ['', 'Other PSP charges: Account Volume Billing', amt(o.volume)], ['', 'Other PSP charges: Active Account Billing', amt(o.active)], ['', 'Other PSP charges: Payout Fee', amt(o.payout)],
      ['=', 'Total PSP payout to Agathos', amt(s.payout)], ['-', 'Final amount to Agathos', amt(s.final)], ['=', 'Total disbursed to Projects/Events', amt(s.merchant)]];
    var tot = rows.reduce(function(t, x){ t.n += x.n; t.gross += x.gross; t.fees += x.fees; t.ag += x.ag; t.net += x.net; return t; }, {n:0, gross:0, fees:0, ag:0, net:0});
    var byProj = [['By project'], ['Project/Event', 'Organisation', 'PSP', 'Model', 'Transactions', 'Total Trx Amt', 'Total PSP trx Fees', 'Total Net to Agathos', 'Total Net to Merchant']]
      .concat(rows.map(function(x){ return [x.p.name, F.ENTITIES[x.p.ent].name, F.PSP_NAME[x.p.psp], F.MODEL_NAME[x.p.model], x.n, amt(x.gross / 100), amt(x.fees / 100), amt(x.ag / 100), amt(x.net / 100)]; }))
      .concat([['Total', '', '', '', tot.n, amt(tot.gross / 100), amt(tot.fees / 100), amt(tot.ag / 100), amt(tot.net / 100)]]);
    var csv = report.concat([[]], summary, [[]], byProj).map(function(r){ return r.map(esc).join(','); }).join('\n');
    var link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    link.download = 'agathos-disbursement-report-' + f.per + '.csv';
    document.body.appendChild(link); link.click(); link.remove();
  }

  /* ---------- page ---------- */
  function render(){
    CONTENT.innerHTML = '<div class="fin">'
      + '<div class="pagehead"><h1>Disbursement Report</h1><span class="spacer"></span><span class="meta">PSP files uploaded up to ' + F.fmtDate(F.UPLOADED) + '</span></div>'
      + '<p class="fin-lede">This payout report is to summarise the amount of funds to be disbursed to various PO/EOs per month. As such, only arrangements through the Master model are reflected. Amounts through the Stripe Connect model are not reflected here.</p>'
      + '<div id="fin-panel">' + panel() + '</div><div class="fin-stage"><div id="fin-body"></div><div class="fin-load" id="fin-load" role="status" aria-live="polite"></div></div></div>';
    renderBody(); markBusy();
  }
  function renderPanel(){ CONTENT.querySelector('#fin-panel').innerHTML = panel(); markBusy(); }
  /* the export only matches the numbers once they are loaded; the panel itself is not redrawn, so focus stays put */
  function markBusy(){
    var csv = CONTENT.querySelector('[data-act="csv"]'); if(csv) csv.disabled = !(V.shown && !busy());
    CONTENT.querySelector('#fin-load').innerHTML = busy() ? '<div class="fin-load-card"><i class="fin-spin" aria-hidden="true"></i>Loading data…</div>' : '';
    CONTENT.querySelector('#fin-body').classList.toggle('is-loading', busy());
  }
  function renderBody(){
    var body = CONTENT.querySelector('#fin-body');
    if(!V.shown){ body.innerHTML = '<div class="card fin-wait">' + IC.filter + 'Pick the filters, then Show report.</div>'; return; }
    var list = slice(V.shown);
    body.innerHTML = summary(sum(list)) + table(list);
    body.classList.toggle('is-loading', busy());
  }
  function focusSoon(sel){ var el = CONTENT.querySelector(sel); if(el) el.focus(); }

  var ACT = {
    psp: function(t){ V.f.psp = t.getAttribute('data-v'); renderPanel(); changed(); },
    openPeriod: function(){ V.open = !V.open; renderPanel(); if(V.open) focusSoon('.fin-menu [aria-selected="true"]'); },
    period: function(t){ V.f.per = t.getAttribute('data-v'); V.open = false; renderPanel(); focusSoon('[data-act="openPeriod"]'); changed(); },
    reset: function(){ V.f = defaults(); V.open = false; renderPanel(); changed(); },
    show: function(){ V.open = false; renderPanel(); load(); },
    fold: function(t){
      var id = t.getAttribute('data-v'), open = !V.fold[id], list = CONTENT.querySelector('#fold-' + id);
      V.fold[id] = open; t.setAttribute('aria-expanded', open); if(list) list.hidden = !open;
      var r = t.closest('.fin-r'); if(r) r.classList.toggle('joined', open);
    },
    csv: exportCSV
  };
  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-act]');
    if(t && CONTENT.contains(t) && ACT[t.getAttribute('data-act')]){ ACT[t.getAttribute('data-act')](t); return; }
    /* a click outside the open list closes it; a click that redrew the page has a target no longer on it */
    if(V.open && ev.target.isConnected && !ev.target.closest('.fin-anchor')){ V.open = false; renderPanel(); }
  });
  document.addEventListener('keydown', function(ev){
    var menu = ev.target.closest && ev.target.closest('.fin-menu');
    if(menu && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')){
      var items = [].slice.call(menu.querySelectorAll('[role="option"]')), i = items.indexOf(ev.target) + (ev.key === 'ArrowDown' ? 1 : -1);
      if(items[i]) items[i].focus();
      ev.preventDefault(); return;
    }
    if(ev.key === 'Escape' && V.open){ V.open = false; renderPanel(); focusSoon('[data-act="openPeriod"]'); }
  });

  render();
})();
</script>
</body>
</html>
