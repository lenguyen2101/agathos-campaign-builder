<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agathos Admin — Recon Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/finance-admin.css">
</head>
<body>

<div id="shell"></div>
<div class="toast" id="toast"></div>
<div class="fin-tip" id="fin-tip" role="tooltip"></div>

<script src="assets/shell.js"></script>
<script src="assets/finance-data.js"></script>
<script>
(function(){
  'use strict';
  var CONTENT = mountShell('finance');
  var F = FIN, C = F.cents, h = F.h;

  var PART = [
    {k:'net', name:'Net to Merchant', css:'var(--s-net)', hex:'#2a78d6'},
    {k:'ag',  name:'Total to Agathos', css:'var(--s-ag)', hex:'#eb6834'},
    {k:'fee', name:'PSP fees', css:'var(--s-fee)', hex:'#1baf7a'}
  ];
  var SVG = function(p, s){ return '<svg width="'+(s||16)+'" height="'+(s||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'; };
  var IC = {
    down: SVG('<path d="M6 9l6 6 6-6"/>', 14), search: SVG('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>', 15),
    check: SVG('<path d="M4.5 12.5l5 5L19.5 7"/>', 16), cal: SVG('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>', 15),
    expand: SVG('<path d="M14.5 4.5h5v5M9.5 19.5h-5v-5M19.5 4.5l-6 6M4.5 19.5l6-6"/>', 15),
    shrink: SVG('<path d="M13.5 5.5v5h5M10.5 18.5v-5h-5M13.5 10.5l6-6M10.5 13.5l-6 6"/>', 15),
    dl: SVG('<path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/>', 15),
    x: SVG('<path d="M7 7l10 10M17 7L7 17"/>', 14), lock: SVG('<rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 12),
    filter: SVG('<path d="M4 5h16l-6.5 7.5V19l-3 1.5v-8z"/>', 20),
    warn: SVG('<path d="M12 3.5l9 16H3z"/><path d="M12 10v4.5M12 17.2h.01"/>', 16)
  };

  /* ---------- data ---------- */
  var ALL = [];
  Object.keys(F.PROJECTS).forEach(function(id){ F.rowsOf(id).forEach(function(r){ if(F.reconciled(r)) ALL.push(F.adminRow(r)); }); });
  ALL.sort(function(a, b){ return a.r.at < b.r.at ? 1 : -1; });
  var PERIODS = F.MONTHS.filter(function(m){ return ALL.some(function(a){ return a.r.per === m; }); });
  var LATEST = PERIODS[PERIODS.length - 1];
  var PSPS = [['','All'],['stripe','Stripe'],['2c2p','2c2p'],['axs','AXS']];
  /* the "doesn't tally" case, for review only (admin review 14/11/2026): three transactions of the latest payout,
     S$0.93 off in all, as a PSP file whose amounts do not add up would show them */
  var OFF = {}, latest = ALL.filter(function(a){ return a.r.per === LATEST; });
  [[2, -0.25], [7, 0.30], [13, -0.38]].forEach(function(x){ if(latest[x[0]]) OFF[latest[x[0]].r.ref] = x[1]; });
  function tallyOf(a){ return V.tally === 'off' && OFF[a.r.ref] ? OFF[a.r.ref] : a.tally; }
  function isOff(a){ return C(tallyOf(a)) !== 0; }

  /* f: the filters as picked; shown: the filters of the numbers on screen. Nothing shows before Show report (T2).
     After that, each filter change loads the report by itself, behind a "Loading data…" overlay (admin review 14/11/2026).
     Defaults, in this order: the latest payout, every PSP, any project or event (optional) */
  function defaults(){ return { pers:[LATEST], psp:'', pid:'' }; }
  var V = { f:defaults(), shown:null, sq:'', open:null, q:'', page:1, pageSize:20, full:false, fold:{}, table:{},
            tally:'ok', onlyOff:false, stats:{ open:false, pers:PERIODS.slice(-6), psp:'' } };
  function stale(){ return !!V.shown && JSON.stringify(V.f) !== JSON.stringify(V.shown); }
  /* the load waits 1 s after the last change, as a call to the server would, so picking 3 months is one load */
  var LOAD_MS = 1000, loadT = null;
  function busy(){ return loadT !== null; }
  function load(){
    clearTimeout(loadT);
    loadT = setTimeout(function(){ loadT = null; V.shown = JSON.parse(JSON.stringify(V.f)); V.page = 1; renderBody(); markBusy(); }, LOAD_MS);
    markBusy();
  }
  /* a filter change: nothing loads before the first Show report */
  function changed(){ if(V.shown && (busy() || stale())) load(); }

  function inScope(a, f){
    if(f.pid && a.r.p.id !== f.pid) return false;
    if(f.psp && a.r.p.psp !== f.psp) return false;
    if(f.pers.length && f.pers.indexOf(a.r.per) < 0) return false;
    return true;
  }
  function slice(){ return V.shown ? ALL.filter(function(a){ return inScope(a, V.shown); }) : []; }
  /* the summary in whole cents, worked out as the team's table (admin review 14/11/2026):
     Total Transactions Amount − PSP fees − Other PSP charges − paid out directly (Connect) = Total PSP payout to Agathos;
     − Total disbursed to Projects/Events = Final amount to Agathos */
  function sum(list){
    var c = {gross:0, fee:0, net:0, ag:0, disbursed:0, paidOut:0, gift:0, fgift:0, bene:0, plat:0, margin:0, off:0, offAmt:0};
    list.forEach(function(a){
      c.gross += C(a.gross); c.fee += C(a.fees) + C(a.feeGift); c.net += C(a.net); c.ag += C(a.toAgathos);
      c.disbursed += C(a.disbursed); c.paidOut += C(a.paidOut);
      c.gift += C(a.gift); c.fgift += C(a.finalGift); c.bene += C(a.bene); c.plat += C(a.platform); c.margin += C(a.margin);
      if(isOff(a)){ c.off++; c.offAmt += Math.abs(C(tallyOf(a))); }
    });
    /* Stripe's monthly charges come off what Stripe pays Agathos */
    var o = F.otherCharges(list), oc = C(o.total), x = function(v){ return v / 100; };
    var payout = c.gross - c.fee - oc - c.paidOut, final = payout - c.disbursed;
    return {n:list.length, gross:x(c.gross), fee:x(c.fee), net:x(c.net), ag:x(c.ag), other:o,
      payout:x(payout), disbursed:x(c.disbursed), paidOut:x(c.paidOut), final:x(final),
      gift:x(c.gift), fgift:x(c.fgift), bene:x(c.bene), plat:x(c.plat), margin:x(c.margin), off:c.off, offAmt:x(c.offAmt)};
  }
  function groupBy(list, key){
    var g = {}, order = [];
    list.forEach(function(a){ var k = key(a); if(!g[k]){ g[k] = []; order.push(k); } g[k].push(a); });
    return order.map(function(k){ return {k:k, list:g[k], s:sum(g[k])}; });
  }

  /* ---------- words ---------- */
  function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function periodLabel(p){
    if(!p.length) return 'All payout periods';
    if(p.length === 1) return F.payoutLabel(p[0]);
    var idx = p.map(function(m){ return PERIODS.indexOf(m); }), run = idx.every(function(x, i){ return !i || x === idx[i-1] + 1; });
    if(run){
      var a = F.payoutLabel(p[0]), b = F.payoutLabel(p[p.length-1]);
      return a.slice(-4) === b.slice(-4) ? a.slice(0, 3) + ' – ' + b : a + ' – ' + b;
    }
    return p.length + ' payout periods';
  }
  function compact(x){ return x >= 1e6 ? 'S$' + (x/1e6).toFixed(1) + 'M' : x >= 1e3 ? 'S$' + (x/1e3).toFixed(1) + 'K' : F.money(x); }
  function seg(act, opts, val, labelledby, lockTo){
    return '<div class="fin-seg" role="group" aria-labelledby="' + labelledby + '">' + opts.map(function(o){
      var on = val === o[0], off = lockTo !== undefined && !on;
      return '<button type="button" data-act="' + act + '" data-v="' + o[0] + '" aria-pressed="' + on + '"' + (on ? ' class="on"' : '') + (off ? ' disabled' : '') + '>' + o[1] + '</button>';
    }).join('') + '</div>';
  }

  /* ---------- filters: Payout period, PSP, Project / Event (optional), then Show report (T1, T2) ---------- */
  function pspField(){
    var p = V.f.pid ? F.PROJECTS[V.f.pid] : null;
    return '<span class="lbl" id="l-psp">PSP' + (p ? '<span class="fin-lock">' + IC.lock + 'Set by the project</span>' : '') + '</span>'
      + seg('psp', PSPS, V.f.psp, 'l-psp', p ? p.psp : undefined);
  }
  function foot(){
    var canCsv = V.shown && !busy();
    return '<button class="btn" type="button" data-act="csv"' + (canCsv ? '' : ' disabled') + '>' + IC.dl + 'Export .csv</button><span class="sp"></span>'
      + '<button class="btn" type="button" data-act="reset">Reset</button>'
      + '<button class="btn primary" type="button" data-act="show">' + IC.search + 'Show report</button>';
  }
  function panel(){
    var p = V.f.pid ? F.PROJECTS[V.f.pid] : null, open = V.open === 'scope';
    return '<section class="card fin-panel" aria-label="Filters"><div class="fin-fields">'
      + '<div class="fin-f period"><span class="lbl" id="l-per">Payout period</span><div class="fin-anchor">'
      +   '<button class="fin-trig" type="button" data-act="openPeriod" aria-haspopup="dialog" aria-expanded="' + (V.open === 'period') + '" aria-labelledby="l-per">'
      +     '<span class="ic">' + IC.cal + '</span><span class="v">' + h(periodLabel(V.f.pers)) + '</span><span class="ic">' + IC.down + '</span></button>'
      +   '<div class="fin-pop period" id="pop-period"' + (V.open === 'period' ? '' : ' hidden') + '>' + periodPicker(V.f.pers, [['last','Latest payout'],['last3','Last 3 payouts']], {preset:'preset', month:'month', done:'closePop'}) + '</div>'
      + '</div></div>'
      + '<div class="fin-f" id="f-psp">' + pspField() + '</div>'
      + '<div class="fin-f scope"><label class="lbl" for="scope-q">Project / Event <span class="opt">Optional</span></label>'
      +   '<div class="fin-anchor fin-combo"><div class="fin-search">' + IC.search
      +     '<input id="scope-q" type="text" role="combobox" aria-autocomplete="list" aria-expanded="' + open + '" aria-controls="scope-list" placeholder="All projects and events" autocomplete="off" value="' + h(p ? p.name : V.sq) + '">'
      +     '<button class="fin-clear" type="button" data-act="clearScope" aria-label="Clear project or event"' + (p || V.sq ? '' : ' hidden') + '>' + IC.x + '</button>'
      +     '<button class="fin-caret" type="button" data-act="toggleScope" tabindex="-1" aria-label="Show the list">' + IC.down + '</button></div>'
      +   '<div class="fin-pop fin-list" id="scope-list" role="listbox" aria-label="Projects and events"' + (open ? '' : ' hidden') + '>' + scopeOptions() + '</div>'
      + '</div></div>'
      + '</div><div class="fin-panel-foot" id="fin-foot">' + foot() + '</div></section>';
  }
  /* every project and event, by organisation; what is typed narrows the list, which scrolls */
  function scopeOptions(){
    var q = V.sq.trim().toLowerCase(), by = {}, order = [];
    Object.keys(F.PROJECTS).forEach(function(id){
      var p = F.PROJECTS[id], e = F.ENTITIES[p.ent];
      if(q && (p.name + ' ' + e.name).toLowerCase().indexOf(q) < 0) return;
      if(!by[p.ent]){ by[p.ent] = []; order.push(p.ent); }
      by[p.ent].push(p);
    });
    if(!order.length) return '<div class="fin-list-empty">No project or event matches “' + h(V.sq) + '”.</div>';
    return order.map(function(eid){
      var e = F.ENTITIES[eid];
      return '<div class="grp">' + h(e.label === 'Personal' ? 'Personal · ' + e.name : e.name) + '</div>' + by[eid].map(function(p){
        var on = V.f.pid === p.id;
        return '<button type="button" role="option" aria-selected="' + on + '" data-act="pickScope" data-v="' + p.id + '"' + (on ? ' class="on"' : '') + '>' + IC.check
          + '<span><b>' + h(p.name) + '</b><small>' + (F.isEv(p) ? 'Event' : 'Project') + ' · ' + F.PSP_NAME[p.psp] + ' ' + F.MODEL_NAME[p.model] + '</small></span></button>';
      }).join('');
    }).join('');
  }
  /* a preset's payout periods: none (every period), the latest, the last n, or a year's */
  function presetPers(v){
    return v === 'all' ? [] : v === 'last' ? [LATEST] : /^last\d+$/.test(v) ? PERIODS.slice(-(+v.slice(4)))
      : PERIODS.filter(function(m){ return F.payoutLabel(m).slice(-4) === v.slice(1); });
  }
  /* the payout period picker of the filters, also used by Statistics (admin review 14/11/2026: "allow custom period"):
     quick picks, then each year's months; act names the actions of this copy */
  function periodPicker(pers, quick, act){
    var years = {}, order = [];
    PERIODS.forEach(function(m){ var y = F.payoutLabel(m).slice(-4); if(!years[y]){ years[y] = []; order.push(y); } years[y].push(m); });
    var same = function(a){ return a.length === pers.length && a.every(function(m){ return pers.indexOf(m) >= 0; }); };
    var presets = quick.map(function(q){ return [q[0], q[1], same(presetPers(q[0]))]; })
      .concat(order.map(function(y){ return ['y' + y, 'All of ' + y, same(years[y])]; })).concat([['all','All', !pers.length]]);
    return '<div class="fin-presets">' + presets.map(function(p){
        return '<button type="button" class="fin-chip' + (p[2] ? ' on' : '') + '" data-act="' + act.preset + '" data-v="' + p[0] + '" aria-pressed="' + p[2] + '">' + p[1] + '</button>';
      }).join('') + '</div>'
      + '<div class="fin-years">' + order.map(function(y){
        var mine = years[y];
        return '<div class="fin-year"><span>' + y + '</span><div class="fin-months">' + F.MON.map(function(mo){
          var per = mine.filter(function(m){ return F.payoutLabel(m).slice(0, 3) === mo; })[0];
          if(!per) return '<button type="button" class="fin-mo" disabled>' + mo + '</button>';
          var on = pers.indexOf(per) >= 0;
          return '<button type="button" class="fin-mo' + (on ? ' on' : '') + '" data-act="' + act.month + '" data-v="' + per + '" aria-pressed="' + on + '" aria-label="' + F.payoutLabel(per) + ' payout">' + mo + '</button>';
        }).join('') + '</div></div>';
      }).join('') + '</div>'
      + '<div class="fin-popfoot"><span>' + (pers.length ? plural(pers.length, 'payout period') + ' picked' : 'All payout periods') + '</span><button class="btn sm" type="button" data-act="' + act.done + '">Done</button></div>';
  }

  /* ---------- summary as a cascade, as the team's table (admin review 14/11/2026). Two sizes only: the three bold,
     coloured lines are large, the rest small; each amount in the font of its label. The two folds stay ---------- */
  function row(cls, op, label, value, sub){
    return '<div class="fin-r ' + cls + '"><i class="op" aria-hidden="true">' + op + '</i><span class="nm">' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span><span class="v">' + value + '</span></div>';
  }
  function fold(id, label){ return '<button type="button" class="fin-fold" data-act="fold" data-v="' + id + '" aria-expanded="' + !!V.fold[id] + '" aria-controls="fold-' + id + '">' + label + IC.down + '</button>'; }
  function cascade(s){
    var o = s.other, m = F.money;
    return '<section class="card fin-cas" aria-labelledby="cas-t"><h2 class="sr" id="cas-t">Summary</h2>'
      + row('l key first', '', 'Total Transactions Amount', m(s.gross), '<span>(including amounts paid directly to Projects/Events by Stripe Connect model)</span><span>' + plural(s.n, 'transaction') + '</span>')
      + row('s', '−', 'Total PSP transactions fees', m(s.fee))
      + row('s' + (V.fold.other ? ' joined' : ''), '−', fold('other', 'Other PSP charges'), m(o.total))
      + '<ul class="fin-sub" id="fold-other"' + (V.fold.other ? '' : ' hidden') + '><li><span>Account Volume Billing</span><b>' + m(o.volume) + '</b></li><li><span>Active Account Billing</span><b>' + m(o.active) + '</b></li><li><span>Payout Fee</span><b>' + m(o.payout) + '</b></li></ul>'
      + row('s', '−', 'Total paid out directly to Projects/Events by Stripe (Connect)', m(s.paidOut))
      + row('l key', '=', 'Total PSP payout to Agathos', m(s.payout), 'What the PSPs paid Agathos')
      + row('s', '−', 'Total disbursed to projects/events', m(s.disbursed))
      + row('l key last' + (V.fold.final ? ' joined' : ''), '=', fold('final', 'Final amount to Agathos'), m(s.final))
      /* the same lines as before; with the other charges they add up to the Final amount */
      + '<ul class="fin-sub in-key" id="fold-final"' + (V.fold.final ? '' : ' hidden') + '>'
      +   '<li><span>Total finalized donor love gift <em>(Total donor love gift)</em></span><b>' + m(s.fgift) + ' <em>(' + m(s.gift) + ')</em></b></li>'
      +   '<li><span>Total beneficiary love gift</span><b>' + m(s.bene) + '</b></li>'
      +   '<li><span>Total Agathos platform fee</span><b>' + m(s.plat) + '</b></li>'
      +   '<li><span>Agathos margin from PSP fees</span><b>' + m(s.margin) + '</b></li>'
      +   '<li><span>Other PSP charges</span><b>' + m(-o.total) + '</b></li>'
      + '</ul></section>';
  }

  /* ---------- statistics: closed until opened, worked out only then, with filters of its own (T9) ---------- */
  /* its payout periods are picked like the filters' (admin review 14/11/2026: "allow custom period"); none picked = all */
  function statsList(){
    var st = V.stats;
    return ALL.filter(function(a){ return (!st.pers.length || st.pers.indexOf(a.r.per) >= 0) && (!st.psp || a.r.p.psp === st.psp); });
  }
  function statsSection(){
    var st = V.stats;
    var head = '<button class="fin-stats-head" type="button" data-act="stats" aria-expanded="' + st.open + '"' + (st.open ? ' aria-controls="fin-stats-body"' : '') + '><span><b>Transaction and average donor love gift trends</b><small>By payout period, and the average donor love gift</small></span>'
      + '<span class="go">' + (st.open ? 'Hide' : 'Show') + IC.down + '</span></button>';
    if(!st.open) return '<section class="card fin-stats">' + head + '</section>';
    var list = statsList(), g = 0, d = 0;
    /* average donor love gift: donor love gifts over the amounts donated; event tickets have no donor love gift */
    list.forEach(function(a){ if(!F.isEv(a.r.p)){ g += C(a.gift); d += C(a.r.recv); } });
    return '<section class="card fin-stats open">' + head + '<div id="fin-stats-body">'
      + '<div class="fin-stats-bar"><div class="fin-f period"><span class="lbl" id="l-sper">Payout periods</span><div class="fin-anchor">'
      +     '<button class="fin-trig" type="button" data-act="sOpen" aria-haspopup="dialog" aria-expanded="' + (V.open === 'speriod') + '" aria-labelledby="l-sper">'
      +       '<span class="ic">' + IC.cal + '</span><span class="v">' + h(periodLabel(st.pers)) + '</span><span class="ic">' + IC.down + '</span></button>'
      +     '<div class="fin-pop period" id="pop-speriod"' + (V.open === 'speriod' ? '' : ' hidden') + '>' + periodPicker(st.pers, [['last6','Last 6 payouts'],['last12','Last 12 payouts']], {preset:'sPreset', month:'sMonth', done:'sDone'}) + '</div>'
      +   '</div></div>'
      +   '<div class="fin-f"><span class="lbl" id="l-spsp">PSP</span>' + seg('spsp', PSPS, st.psp, 'l-spsp') + '</div></div>'
      + '<div class="fin-stats-grid"><div class="fin-kpi"><span class="lbl">Average Donor Love Gift</span><b>' + (d ? (g / d * 100).toFixed(1) + '%' : '—') + '</b>'
      +   '<small>' + F.money(g / 100) + ' in donor love gifts on ' + F.money(d / 100) + ' donated</small></div>'
      + byPeriod(list) + '</div></div></section>';
  }
  function legend(){ return '<div class="fin-legend">' + PART.map(function(p){ return '<span><i style="background:' + p.css + '"></i>' + p.name + '</span>'; }).join('') + '</div>'; }
  function niceMax(v){ if(v <= 0) return 1; var e = Math.pow(10, Math.floor(Math.log10(v))), f = v/e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
  function tick(v){ return v >= 1000 ? (v/1000).toLocaleString('en-SG', {maximumFractionDigits:1}) + 'K' : String(Math.round(v)); }
  /* columns by payout period: the three parts stacked, the biggest at the baseline; a table view next to it */
  function byPeriod(list){
    var groups = groupBy(list, function(a){ return a.r.per; }).sort(function(a, b){ return a.k < b.k ? -1 : 1; });
    var W = 720, H = 250, L = 46, R = 10, T = 18, B = 42, iw = W - L - R, ih = H - T - B;
    var max = niceMax(Math.max.apply(null, groups.map(function(g){ return g.s.gross; }).concat([1])));
    var band = iw / Math.max(groups.length, 1), cw = Math.min(24, band * .5), y = function(v){ return T + ih - v / max * ih; };
    var grid = [0, max/2, max].map(function(v){ return '<line class="' + (v ? 'g' : 'base') + '" x1="' + L + '" x2="' + (W-R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L-8) + '" y="' + (y(v)+3.5) + '" text-anchor="end">' + tick(v) + '</text>'; }).join('');
    var maxG = groups.reduce(function(m, g){ return g.s.gross > m.s.gross ? g : m; }, groups[0] || {s:{gross:0}});
    var lastYear = '';
    var cols = groups.map(function(g, i){
      var x0 = L + band * i, cx = x0 + band/2, xs = cx - cw/2, base = T + ih, vals = [g.s.net, g.s.ag, g.s.fee], segs = '', top = base;
      vals.forEach(function(v, j){
        var hgt = v / max * ih; if(hgt <= 0) return;
        var gap = j ? 2 : 0, y1 = top - hgt, isTop = j === 2 || vals.slice(j+1).every(function(z){ return z <= 0; });
        var hh = Math.max(0, hgt - gap);
        if(isTop && hh > 4) segs += '<path d="M' + xs + ' ' + (y1 + hh) + 'V' + (y1 + 4) + 'Q' + xs + ' ' + y1 + ' ' + (xs + 4) + ' ' + y1 + 'H' + (xs + cw - 4) + 'Q' + (xs + cw) + ' ' + y1 + ' ' + (xs + cw) + ' ' + (y1 + 4) + 'V' + (y1 + hh) + 'Z" fill="' + PART[j].hex + '"/>';
        else segs += '<rect x="' + xs + '" y="' + y1 + '" width="' + cw + '" height="' + hh + '" fill="' + PART[j].hex + '"/>';
        top = y1;
      });
      var lab = F.payoutLabel(g.k), yr = lab.slice(-4), mo = lab.slice(0, 3);
      var yrLabel = yr !== lastYear ? '<text class="yr" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + yr + '</text>' : '';
      lastYear = yr;
      var tot = g === maxG ? '<text class="tot" x="' + cx + '" y="' + (top - 6) + '" text-anchor="middle">' + compact(g.s.gross) + '</text>' : '';
      return '<g class="col" tabindex="0" data-tip="col" data-v="' + g.k + '" aria-label="' + lab + ' payout: Total Trx Amt ' + F.money(g.s.gross) + '">'
        + '<rect class="hit" x="' + x0 + '" y="' + T + '" width="' + band + '" height="' + ih + '" rx="4"/>' + segs + tot
        + '<text x="' + cx + '" y="' + (H - 22) + '" text-anchor="middle">' + mo + '</text>' + yrLabel + '</g>';
    }).join('');
    var asTable = V.table.period;
    var table = '<div class="tablewrap" style="margin-top:10px"><table class="ct mini"><thead><tr><th>Payout period</th><th class="r">Total Trx Amt</th>'
      + PART.map(function(p){ return '<th class="r">' + p.name + '</th>'; }).join('') + '</tr></thead><tbody>'
      + groups.map(function(g){ return '<tr><td>' + F.payoutLabel(g.k) + '</td><td class="r num">' + F.num(g.s.gross) + '</td><td class="r num">' + F.num(g.s.net) + '</td><td class="r num">' + F.num(g.s.ag) + '</td><td class="r num">' + F.num(g.s.fee) + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
    var chart = groups.length ? legend() + '<svg class="fin-svg" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Total Trx Amt by payout period">' + grid + cols + '</svg>' : '<div class="fin-empty">No transactions.</div>';
    return '<div class="fin-chart"><div class="fin-ch-head"><div><h2>By payout period</h2><p>Total Trx Amt per payout, split into its three parts.</p></div>'
      + '<button class="fin-view" type="button" data-act="view" data-v="period" aria-pressed="' + !!asTable + '">' + (asTable ? 'Chart' : 'Table') + '</button></div>'
      + (asTable ? table : chart) + '</div>';
  }

  /* ---------- transactions: the columns of 3.0 (C77–C95), the amounts as the team set them (admin review 14/11/2026):
     Transaction Amount, a line, then the funding side up to Net to Merchant, then the donor love gift side up to
     Total to Agathos. Three columns bold; Net to Merchant and Total to Agathos tinted like their parts in the chart.
     Agathos Payout Date left out (D96). Tally check back at the end ---------- */
  var COLS = [
    ['Project / Event Name'], ['Transaction Date & Time'], ['Transaction Reference'], ['Payment Method'], ['Receiving Currency'],
    ['Transaction Amount','r b vline','Funding Amount + Donor Love Gift Amount'], ['Funding Amount','r b'], ['PSP Fees applied on Funding Amount','r'],
    ['Beneficiary Love Gift Amount (Projects)','r'], ['Agathos Platform Fee (Events)','r'],
    ['Net to Merchant','r c-net','Funding Amount minus PSP fees, Agathos Margin, Bene Love Gift, Agathos Platform Fee'],
    ['Donor Love Gift Amount','r b'], ['PSP Fees applied on Donor Love Gift Amount','r'], ['Finalized Donor Love Gift Amount','r'], ['Agathos Margin from PSP fees','r'],
    ['Total to Agathos','r c-ag','Bene Love Gift + Finalized Donor Love Gift + Agathos Margin'],
    ['PSP Payout Date'], ['PSP name'], ['PSP merchant id'], ['PSP model'],
    ['Tally check','','Transaction Amount minus both PSP fees, Net to Merchant and Total to Agathos: 0 when it tallies']
  ];
  function tallyCell(a){
    var t = tallyOf(a);
    return C(t) === 0 ? '<span class="ok">' + IC.check + 'OK</span>' : '<span class="t-off">' + IC.warn + (t > 0 ? '+' : '−') + F.num(Math.abs(t)) + '</span>';
  }
  function cells(a){
    var r = a.r, p = r.p, ev = F.isEv(p), na = '<span class="na">—</span>', n = F.num;
    return [
      '<span class="tname">' + h(p.name) + '</span><span class="sub">' + h(F.ENTITIES[p.ent].name) + '</span>',
      F.fmtDMY(r.day) + ' ' + r.at.slice(11, 16), '<span class="mono">' + h(r.ref) + '</span>',
      h(r.method) + (r.intl ? '<span class="sub">International</span>' : ''), 'SGD',
      n(a.gross), n(r.recv), n(a.fees), ev ? na : n(a.bene), ev ? n(a.platform) : na, n(a.net),
      ev ? na : n(a.gift), ev ? na : n(a.feeGift), ev ? na : n(a.finalGift), n(a.margin), n(a.toAgathos),
      F.fmtDMY(a.payDate), a.psp, a.mid ? '<span class="mono">' + h(a.mid) + '</span>' : na, a.model, tallyCell(a)
    ];
  }
  function tableList(){
    var list = slice(), q = V.q.trim().toLowerCase();
    if(V.onlyOff) list = list.filter(isOff);
    if(!q) return list;
    return list.filter(function(a){ return (a.r.p.name + ' ' + F.ENTITIES[a.r.p.ent].name + ' ' + a.r.ref).toLowerCase().indexOf(q) >= 0; });
  }
  /* the Tally check module (back on 14/11/2026): every transaction of the report, OK or off, above the table */
  function tallyBox(s){
    if(!s.off) return '<div class="fin-tally ok">' + IC.check + '<span><b>Tally check</b>All ' + plural(s.n, 'transaction') + ' tally.</span></div>';
    return '<div class="fin-tally off">' + IC.warn + '<span><b>Tally check</b>' + s.off + ' of ' + plural(s.n, 'transaction') + ' don\'t tally · ' + F.money(s.offAmt) + ' off</span>'
      + '<button class="btn sm" type="button" data-act="onlyOff" aria-pressed="' + V.onlyOff + '">' + (V.onlyOff ? 'Show all' : 'Show only these') + '</button></div>';
  }
  function txCard(s){
    return '<section class="card fin-tx' + (V.full ? ' full' : '') + '" aria-labelledby="tx-t"><div class="fin-tx-head"><h2 id="tx-t">Transactions</h2><span class="n" id="tx-n"></span>'
      + '<span class="sp"></span>'
      + '<label class="fin-search">' + IC.search + '<input id="tx-q" type="search" placeholder="Search reference, project, event or organisation" autocomplete="off" value="' + h(V.q) + '"></label>'
      + '<button class="btn" type="button" data-act="full" aria-pressed="' + V.full + '">' + (V.full ? IC.shrink + 'Exit full screen' : IC.expand + 'View full screen') + '</button></div>'
      + tallyBox(s) + '<div id="tx-body"></div></section>';
  }
  function renderTable(){
    var list = tableList(), pages = Math.max(1, Math.ceil(list.length / V.pageSize));
    if(V.page > pages) V.page = pages;
    var start = (V.page - 1) * V.pageSize, rows = list.slice(start, start + V.pageSize);
    var wrap = CONTENT.querySelector('#tx-body .tablewrap'), left = wrap ? wrap.scrollLeft : 0;
    CONTENT.querySelector('#tx-n').textContent = list.length;
    CONTENT.querySelector('#tx-body').innerHTML = list.length
      ? '<div class="tablewrap"><table class="ct fin-t"><thead><tr>' + COLS.map(function(c){ return '<th class="' + (c[1] || '') + '"' + (c[2] ? ' title="' + h(c[2]) + '"' : '') + '>' + h(c[0]) + '</th>'; }).join('') + '</tr></thead><tbody>'
        + rows.map(function(a){ return '<tr' + (isOff(a) ? ' class="is-off"' : '') + '>' + cells(a).map(function(v, i){ return '<td class="num ' + (COLS[i][1] || '') + '">' + v + '</td>'; }).join('') + '</tr>'; }).join('')
        + '</tbody></table></div><div class="tfoot"><div class="left">Showing ' + (start + 1) + '–' + (start + rows.length) + ' of ' + list.length + ' transactions</div>' + pager(pages) + '</div>'
      : '<div class="tablewrap"><div class="fin-empty">' + (V.q ? 'No transaction matches “' + h(V.q) + '”.' : 'No transactions match these filters.') + '</div></div>';
    var w2 = CONTENT.querySelector('#tx-body .tablewrap'); if(w2 && left) w2.scrollLeft = left;
  }
  /* Ant-style page list, as on the Campaign page */
  function pageList(cur, total){
    var out = [], i;
    if(total <= 7){ for(i = 1; i <= total; i++) out.push(i); return out; }
    var lo = Math.max(2, cur - 1), hi = Math.min(total - 1, cur + 1);
    if(cur <= 4){ lo = 2; hi = 5; }
    if(cur >= total - 3){ lo = total - 4; hi = total - 1; }
    out.push(1); if(lo > 2) out.push('gap');
    for(i = lo; i <= hi; i++) out.push(i);
    if(hi < total - 1) out.push('gap');
    out.push(total);
    return out;
  }
  function pager(totalPages){
    return '<div class="pager"><button class="arw" type="button" data-act="page" data-v="' + (V.page - 1) + '"' + (V.page === 1 ? ' disabled' : '') + ' aria-label="Previous page">‹</button>'
      + pageList(V.page, totalPages).map(function(p){
          return p === 'gap' ? '<span class="gap">•••</span>' : '<button class="pg' + (p === V.page ? ' on' : '') + '" type="button" data-act="page" data-v="' + p + '"' + (p === V.page ? ' aria-current="page"' : '') + '>' + p + '</button>';
        }).join('')
      + '<button class="arw" type="button" data-act="page" data-v="' + (V.page + 1) + '"' + (V.page === totalPages ? ' disabled' : '') + ' aria-label="Next page">›</button>'
      + '<select id="tx-size" aria-label="Rows per page">' + [10, 20, 50, 100].map(function(n){ return '<option value="' + n + '"' + (V.pageSize === n ? ' selected' : '') + '>' + n + ' / page</option>'; }).join('') + '</select></div>';
  }

  /* ---------- CSV of the report on screen, summary first ---------- */
  function exportCSV(){
    if(!V.shown || busy()) return;
    var f = V.shown, list = slice(), s = sum(list), esc = function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    /* the summary in the order of the page, then one line per transaction in the columns of the table */
    var head = [['Payout Period', periodLabel(f.pers)], ['PSP', f.psp ? F.PSP_NAME[f.psp] : 'All'], ['Project / Event', f.pid ? F.PROJECTS[f.pid].name : 'All projects and events'],
      ['Total Transactions Amount (including amounts paid directly to Projects/Events by Stripe Connect model)', s.gross.toFixed(2)],
      ['Total PSP transactions fees', s.fee.toFixed(2)], ['Other PSP charges', s.other.total.toFixed(2)],
      ['Total paid out directly to Projects/Events by Stripe (Connect)', s.paidOut.toFixed(2)], ['Total PSP payout to Agathos', s.payout.toFixed(2)],
      ['Total disbursed to projects/events', s.disbursed.toFixed(2)], ['Final amount to Agathos', s.final.toFixed(2)],
      ['Total finalized donor love gift', s.fgift.toFixed(2)], ['Total donor love gift', s.gift.toFixed(2)], ['Total beneficiary love gift', s.bene.toFixed(2)],
      ['Total Agathos platform fee', s.plat.toFixed(2)], ['Agathos margin from PSP fees', s.margin.toFixed(2)],
      ['Tally check', s.off ? s.off + ' of ' + s.n + ' transactions do not tally (' + s.offAmt.toFixed(2) + ' off)' : 'All ' + s.n + ' transactions tally']];
    var lines = list.map(function(a){ var r = a.r, t = tallyOf(a);
      return [r.p.name, r.at.replace('T', ' '), r.ref, r.method + (r.intl ? ' (international)' : ''), 'SGD', a.gross.toFixed(2), r.recv.toFixed(2), a.fees.toFixed(2),
        a.bene.toFixed(2), a.platform.toFixed(2), a.net.toFixed(2), a.gift.toFixed(2), a.feeGift.toFixed(2), a.finalGift.toFixed(2), a.margin.toFixed(2), a.toAgathos.toFixed(2),
        a.payDate, a.psp, a.mid, a.model, C(t) === 0 ? 'OK' : t.toFixed(2)]; });
    var csv = head.map(function(x){ return x.map(esc).join(','); }).concat(['', COLS.map(function(c){ return esc(c[0]); }).join(',')], lines.map(function(x){ return x.map(esc).join(','); })).join('\n');
    var link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    link.download = 'agathos-recon-overview.csv';
    document.body.appendChild(link); link.click(); link.remove();
  }

  /* ---------- page ---------- */
  function render(){
    CONTENT.innerHTML = '<div class="fin">' + reviewBar()
      + '<div class="pagehead"><h1>Recon Overview</h1><span class="spacer"></span><span class="meta">PSP files uploaded up to ' + F.fmtDate(F.UPLOADED) + '</span></div>'
      + '<div id="fin-panel">' + panel() + '</div><div class="fin-stage"><div id="fin-body"></div><div class="fin-load" id="fin-load" role="status" aria-live="polite"></div></div></div>';
    renderBody(); markBusy();
  }
  /* review only, not part of the design: shows the Tally check when transactions don't tally (admin review 14/11/2026) */
  function reviewBar(){
    return '<div class="fin-review"><b>Review</b><span>Not part of the design.</span><span class="lbl" id="l-rv">Tally check</span>'
      + seg('tally', [['ok','All tally'],['off','Some don\'t tally']], V.tally, 'l-rv') + '</div>';
  }
  function renderPanel(){ CONTENT.querySelector('#fin-panel').innerHTML = panel(); markBusy(); }
  /* the parts of the panel that follow the Project / Event box, redrawn without touching the box, so typing keeps its caret and accents */
  function renderPanelParts(){
    CONTENT.querySelector('#f-psp').innerHTML = pspField();
    CONTENT.querySelector('#scope-list').innerHTML = scopeOptions();
    var clr = CONTENT.querySelector('.fin-clear'); if(clr) clr.hidden = !(V.f.pid || V.sq);
    markBusy();
  }
  function markBusy(){
    CONTENT.querySelector('#fin-foot').innerHTML = foot();
    CONTENT.querySelector('#fin-load').innerHTML = busy() ? '<div class="fin-load-card"><i class="fin-spin" aria-hidden="true"></i>Loading data…</div>' : '';
    CONTENT.querySelector('#fin-body').classList.toggle('is-loading', busy());
  }
  function renderBody(){
    var body = CONTENT.querySelector('#fin-body');
    if(!V.shown){ body.innerHTML = '<div class="card fin-wait">' + IC.filter + 'Pick the filters, then Show report.</div>'; document.documentElement.classList.remove('fin-lock'); return; }
    var s = sum(slice());
    body.innerHTML = cascade(s) + statsSection() + txCard(s);
    body.classList.toggle('is-loading', busy());
    renderTable();
    document.documentElement.classList.toggle('fin-lock', V.full);
  }
  function focusSoon(sel){ var el = CONTENT.querySelector(sel); if(el) el.focus(); }

  /* ---------- the Project / Event box ---------- */
  /* the list opens on a click in the box, on typing or on the down arrow; not on focus, so picking one does not open it again */
  function setScopeOpen(open){
    if(open && V.open === 'period') setPeriodOpen(false);
    V.open = open ? 'scope' : (V.open === 'scope' ? null : V.open);
    var list = CONTENT.querySelector('#scope-list'), input = CONTENT.querySelector('#scope-q');
    if(list) list.hidden = !open;
    if(input) input.setAttribute('aria-expanded', open);
  }
  function setPeriodOpen(open){
    V.open = open ? 'period' : (V.open === 'period' ? null : V.open);
    var pop = CONTENT.querySelector('#pop-period'), trig = CONTENT.querySelector('[data-act="openPeriod"]');
    if(pop) pop.hidden = !open;
    if(trig) trig.setAttribute('aria-expanded', open);
  }
  function setSPeriodOpen(open){
    V.open = open ? 'speriod' : (V.open === 'speriod' ? null : V.open);
    var pop = CONTENT.querySelector('#pop-speriod'), trig = CONTENT.querySelector('[data-act="sOpen"]');
    if(pop) pop.hidden = !open;
    if(trig) trig.setAttribute('aria-expanded', open);
  }
  function scopeTyped(value){
    V.sq = value;
    /* typing again after a pick starts a new search: the pick, and the PSP lock with it, are let go */
    if(V.f.pid){ V.f.pid = ''; }
    renderPanelParts(); setScopeOpen(true); changed();
  }

  var ACT = {
    openPeriod: function(){ var open = V.open !== 'period'; if(V.open === 'scope') setScopeOpen(false); setPeriodOpen(open); },
    closePop: function(){ V.open = null; renderPanel(); focusSoon('[data-act="openPeriod"]'); },
    preset: function(t){ V.f.pers = presetPers(t.getAttribute('data-v')); renderPanel(); changed(); },
    month: function(t){ var m = t.getAttribute('data-v'), p = V.f.pers; V.f.pers = p.indexOf(m) >= 0 ? p.filter(function(x){ return x !== m; }) : p.concat([m]).sort(); renderPanel(); changed(); },
    psp: function(t){ V.f.psp = t.getAttribute('data-v'); renderPanelParts(); changed(); },
    /* picking a project or event sets the PSP to its own and locks it there (T1) */
    pickScope: function(t){ var p = F.PROJECTS[t.getAttribute('data-v')]; V.f.pid = p.id; V.f.psp = p.psp; V.sq = ''; V.open = null; renderPanel(); focusSoon('#scope-q'); changed(); },
    clearScope: function(){ V.f.pid = ''; V.sq = ''; V.open = null; renderPanel(); focusSoon('#scope-q'); changed(); },
    toggleScope: function(){ setScopeOpen(V.open !== 'scope'); focusSoon('#scope-q'); },
    reset: function(){ V.f = defaults(); V.sq = ''; V.open = null; renderPanel(); changed(); },
    show: function(){ V.open = null; renderPanel(); load(); },
    fold: function(t){
      var id = t.getAttribute('data-v'), open = !V.fold[id], list = CONTENT.querySelector('#fold-' + id);
      V.fold[id] = open; t.setAttribute('aria-expanded', open); if(list) list.hidden = !open;
      var r = t.closest('.fin-r'); if(r) r.classList.toggle('joined', open);
    },
    stats: function(){ V.stats.open = !V.stats.open; renderBody(); focusSoon('[data-act="stats"]'); },
    /* the Statistics period picker: stays open while picking, Done closes it */
    sOpen: function(){ if(V.open === 'period') setPeriodOpen(false); setSPeriodOpen(V.open !== 'speriod'); },
    sPreset: function(t){ V.stats.pers = presetPers(t.getAttribute('data-v')); V.open = 'speriod'; renderBody(); },
    sMonth: function(t){ var m = t.getAttribute('data-v'), p = V.stats.pers; V.stats.pers = p.indexOf(m) >= 0 ? p.filter(function(x){ return x !== m; }) : p.concat([m]).sort(); V.open = 'speriod'; renderBody(); },
    sDone: function(){ V.open = null; renderBody(); focusSoon('[data-act="sOpen"]'); },
    tally: function(t){ V.tally = t.getAttribute('data-v'); V.onlyOff = false; render(); },
    onlyOff: function(){ V.onlyOff = !V.onlyOff; V.page = 1; renderBody(); },
    spsp: function(t){ V.stats.psp = t.getAttribute('data-v'); renderBody(); },
    view: function(t){ var id = t.getAttribute('data-v'); V.table[id] = !V.table[id]; renderBody(); },
    page: function(t){ V.page = +t.getAttribute('data-v'); renderTable(); },
    full: function(){ V.full = !V.full; renderBody(); focusSoon('[data-act="full"]'); },
    csv: exportCSV
  };

  /* ---------- chart tooltip: values lead, names follow; built with textContent ---------- */
  var tip = document.getElementById('fin-tip');
  function showTip(el, x, y){
    var v = el.getAttribute('data-v'), s = sum(statsList().filter(function(a){ return a.r.per === v; }));
    tip.textContent = '';
    var t = document.createElement('span'); t.className = 't'; t.textContent = F.payoutLabel(v) + ' payout'; tip.appendChild(t);
    var st = document.createElement('strong'); st.textContent = F.money(s.gross) + ' Total Trx Amt'; tip.appendChild(st);
    PART.forEach(function(p, i){
      var row = document.createElement('div'); row.className = 'r';
      var k = document.createElement('i'); k.style.background = p.hex; row.appendChild(k);
      var n = document.createElement('span'); n.textContent = p.name; row.appendChild(n);
      var b = document.createElement('b'); b.textContent = F.money([s.net, s.ag, s.fee][i]); row.appendChild(b);
      tip.appendChild(row);
    });
    tip.classList.add('show');
    var w = tip.offsetWidth, hgt = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px';
    tip.style.top = Math.max(8, y - hgt - 12) + 'px';
  }
  function hideTip(){ tip.classList.remove('show'); }
  document.addEventListener('pointermove', function(ev){
    var el = ev.target.closest && ev.target.closest('[data-tip]');
    if(el && CONTENT.contains(el)) showTip(el, ev.clientX, ev.clientY); else hideTip();
  });
  document.addEventListener('focusin', function(ev){
    var el = ev.target.closest && ev.target.closest('[data-tip]');
    if(el){ var b = el.getBoundingClientRect(); showTip(el, b.left + b.width / 2, b.top); } else hideTip();
  });

  /* ---------- events ---------- */
  document.addEventListener('click', function(ev){
    if(!ev.target.isConnected) return;
    var t = ev.target.closest('[data-act]');
    /* a click outside an open list closes it */
    if(V.open === 'period' && !ev.target.closest('#pop-period') && !(t && t.getAttribute('data-act') === 'openPeriod')) setPeriodOpen(false);
    if(V.open === 'speriod' && !ev.target.closest('#pop-speriod') && !(t && t.getAttribute('data-act') === 'sOpen')) setSPeriodOpen(false);
    if(V.open === 'scope' && !ev.target.closest('.fin-combo')) setScopeOpen(false);
    if(ev.target.id === 'scope-q'){ setScopeOpen(true); return; }
    if(t && CONTENT.contains(t) && ACT[t.getAttribute('data-act')]) ACT[t.getAttribute('data-act')](t);
  });
  document.addEventListener('input', function(ev){
    if(ev.target.id === 'scope-q' && !ev.isComposing) scopeTyped(ev.target.value);
    if(ev.target.id === 'tx-q'){ V.q = ev.target.value; V.page = 1; renderTable(); }
  });
  document.addEventListener('compositionend', function(ev){ if(ev.target.id === 'scope-q') scopeTyped(ev.target.value); });
  document.addEventListener('change', function(ev){ if(ev.target.id === 'tx-size'){ V.pageSize = +ev.target.value; V.page = 1; renderTable(); } });
  document.addEventListener('keydown', function(ev){
    /* the Project / Event list: down from the box into the list, up and down through it, Escape back to the box */
    var inList = ev.target.closest && ev.target.closest('#scope-list');
    if((ev.target.id === 'scope-q' || inList) && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')){
      setScopeOpen(true);
      var items = [].slice.call(CONTENT.querySelectorAll('#scope-list [role="option"]')), i = inList ? items.indexOf(ev.target) + (ev.key === 'ArrowDown' ? 1 : -1) : 0;
      if(i < 0) focusSoon('#scope-q'); else if(items[i]) items[i].focus();
      ev.preventDefault(); return;
    }
    if(ev.key === 'Escape'){
      if(V.open === 'scope'){ setScopeOpen(false); focusSoon('#scope-q'); return; }
      if(V.open === 'period'){ ACT.closePop(); return; }
      if(V.open === 'speriod'){ ACT.sDone(); return; }
      if(V.full){ ACT.full(); }
    }
    if(ev.key === 'Enter' && ev.target.id === 'scope-q'){
      var first = CONTENT.querySelector('#scope-list [role="option"]');
      if(V.open === 'scope' && first){ ev.preventDefault(); ACT.pickScope(first); }
    }
  });

  render();
})();
