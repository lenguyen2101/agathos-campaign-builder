<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agathos Admin — Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="shell"></div>

<div class="overlay" id="delOverlay">
  <div class="modal">
    <div class="mh">
      <span class="mi err" id="delIcon"></span>
      <div>
        <h3>Delete campaign?</h3>
        <div class="mb" id="delMsg"></div>
      </div>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeDelete()">Cancel</button>
      <button class="btn solid-danger" id="delConfirm">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/mock-data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/shell.js"></script>
<script>
  var CONTENT = mountShell('campaign');
  document.getElementById('delIcon').innerHTML = icon('warn', 22);

  var COLS = [
    {key:'index',     label:'Index',        sortable:false, w:70},
    {key:'id',        label:'ID',           sortable:true,  w:180},
    {key:'name',      label:'Campaign',     sortable:true,  w:250},
    {key:'status',    label:'Status',       sortable:true,  w:125},
    {key:'start',     label:'Start Date',   sortable:true,  w:125},
    {key:'end',       label:'End Date',     sortable:true,  w:125},
    {key:'items',     label:'Items',        sortable:true,  w:85},
    {key:'goal',      label:'Total Goal',   sortable:true,  w:150},
    {key:'orgs',      label:'Organisations',sortable:true,  w:140},
    {key:'promotion', label:'Promotion',    sortable:false, w:170},
    {key:'spotlight', label:'Spotlight',    sortable:true,  w:110},
    {key:'updatedAt', label:'Last Updated', sortable:true,  w:130},
    {key:'action',    label:'Action',       sortable:false, w:155}
  ];

  var PAGE_SIZES = [10, 20, 50, 100];
  var V = { status:'All', q:'', searchOpen:false, sort:'updatedAt', dir:'desc',
            page:1, pageSize:20, delId:null };

  /* Ant-style page list: first, last, a window around the current page, and
     ellipses for the gaps. */
  function pageList(cur, total){
    var out = [], i;
    if(total <= 7){
      for(i = 1; i <= total; i++) out.push(i);
      return out;
    }
    var lo = Math.max(2, cur - 1), hi = Math.min(total - 1, cur + 1);
    if(cur <= 4){ lo = 2; hi = 5; }
    if(cur >= total - 3){ lo = total - 4; hi = total - 1; }
    out.push(1);
    if(lo > 2) out.push('gap');
    for(i = lo; i <= hi; i++) out.push(i);
    if(hi < total - 1) out.push('gap');
    out.push(total);
    return out;
  }

  /* Drop the sticky-column shadow once the table is scrolled fully right —
     at that point the Action column is not covering anything. */
  function updateScrollShadow(){
    var w = CONTENT.querySelector('.tablewrap');
    if(!w) return;
    w.classList.toggle('pin-right', w.scrollWidth - w.clientWidth - w.scrollLeft > 1);
  }
  window.addEventListener('resize', updateScrollShadow);

  function gotoPage(p){ V.page = p; render(); window.scrollTo(0, 0); }
  function setPageSize(n){ V.pageSize = Number(n); V.page = 1; render(); }

  function pager(totalPages){
    var h = '<div class="pager">'
      + '<button class="arw" onclick="gotoPage(' + (V.page - 1) + ')"' + (V.page === 1 ? ' disabled' : '') + '>‹</button>';
    pageList(V.page, totalPages).forEach(function(p){
      h += p === 'gap'
        ? '<span class="gap">•••</span>'
        : '<button class="pg' + (p === V.page ? ' on' : '') + '" onclick="gotoPage(' + p + ')">' + p + '</button>';
    });
    h += '<button class="arw" onclick="gotoPage(' + (V.page + 1) + ')"' + (V.page === totalPages ? ' disabled' : '') + '>›</button>'
      + '<select onchange="setPageSize(this.value)">'
      + PAGE_SIZES.map(function(n){
          return '<option value="' + n + '"' + (V.pageSize === n ? ' selected' : '') + '>' + n + ' / page</option>';
        }).join('')
      + '</select></div>';
    return h;
  }

  /* ----- data shaping ----- */
  function sortVal(c, key){
    switch(key){
      case 'id':        return c.id;
      case 'name':      return (c.name || '').toLowerCase();
      case 'status':    return STATUSES.indexOf(statusOf(c));
      case 'start':     return c.start || '';
      case 'end':       return c.end || '';
      case 'items':     return c.items.length;
      case 'goal':      return c.showGoal ? totalGoal(c.items) : -1;
      case 'orgs':      return orgsOf(c.items).length;
      case 'spotlight': return c.spotlight ? 1 : 0;
      case 'updatedAt': return c.updatedAt || '';
      default:          return '';
    }
  }

  function rows(){
    var list = listCampaigns().filter(function(c){
      if(V.status !== 'All' && statusOf(c) !== V.status) return false;
      if(!V.q) return true;
      var hay = (c.id + ' ' + c.name + ' ' + c.eyebrow + ' ' + c.subtitle + ' ' + orgsOf(c.items).join(' ')).toLowerCase();
      return hay.indexOf(V.q.toLowerCase()) >= 0;
    });
    var d = V.dir === 'asc' ? 1 : -1;
    return list.sort(function(a, b){
      var x = sortVal(a, V.sort), y = sortVal(b, V.sort);
      if(x < y) return -1 * d;
      if(x > y) return 1 * d;
      return 0;
    });
  }

  /* ----- toolbar ----- */
  function toggleSearch(){ V.searchOpen = !V.searchOpen; render(); }
  function applySearch(){
    V.q      = document.getElementById('fq').value.trim();
    V.status = document.getElementById('fstatus').value;
    V.page   = 1;
    render();
  }
  function resetSearch(){ V.q = ''; V.status = 'All'; V.page = 1; render(); }
  function refreshList(){ render(); toast('List refreshed'); }

  function sortBy(key){
    if(V.sort === key){ V.dir = V.dir === 'asc' ? 'desc' : 'asc'; }
    else { V.sort = key; V.dir = 'asc'; }
    V.page = 1;
    render();
  }

  /* ----- render ----- */
  function render(){
    var all = listCampaigns();
    var counts = {};
    all.forEach(function(c){ var s = statusOf(c); counts[s] = (counts[s] || 0) + 1; });

    var h = '<div class="pagehead">'
      + '<h1>Campaigns</h1>'
      + '<span class="spacer"></span>'
      + '<div class="acts">'
      +   '<button class="btn" onclick="refreshList()">' + icon('refresh', 16) + 'Refresh list</button>'
      +   '<a class="btn primary" href="create.html">' + icon('plus', 16) + 'Create a new Campaign</a>'
      + '</div></div>';

    h += '<div class="searchbar">'
      + '<button class="btn blue" onclick="toggleSearch()">' + icon('search', 16) + 'Toggle Search</button>'
      + '<span class="spacer" style="flex:1"></span>'
      + '<span class="tfoot" style="padding:0">' + all.length + ' total · '
      +   (counts.ONGOING || 0) + ' ongoing · ' + (counts.REVIEW || 0) + ' review · '
      +   (counts.DRAFT || 0) + ' draft</span>'
      + '</div>';

    h += '<div class="searchpanel' + (V.searchOpen ? ' show' : '') + '">'
      + '<div class="row">'
      +   '<div class="field" style="margin:0"><label>Keyword</label>'
      +     '<input class="ctl" type="text" id="fq" value="' + esc(V.q) + '" placeholder="ID, name, tagline or organisation"'
      +     ' onkeydown="if(event.key===\'Enter\')applySearch()"></div>'
      +   '<div class="field" style="margin:0"><label>Status</label><select class="ctl" id="fstatus">'
      +     ['All'].concat(STATUSES).map(function(s){
              return '<option value="' + s + '"' + (V.status === s ? ' selected' : '') + '>'
                + (s === 'All' ? 'All' : s.toUpperCase()) + (s === 'All' ? ' (' + all.length + ')' : ' (' + (counts[s] || 0) + ')') + '</option>';
            }).join('')
      +   '</select></div>'
      + '</div>'
      + '<div class="foot"><button class="btn" onclick="resetSearch()">Reset</button>'
      + '<button class="btn primary" onclick="applySearch()">' + icon('search', 16) + 'Search</button></div>'
      + '</div>';

    var list = rows();
    var totalPages = Math.max(1, Math.ceil(list.length / V.pageSize));
    if(V.page > totalPages) V.page = totalPages;
    var offset = (V.page - 1) * V.pageSize;
    var page   = list.slice(offset, offset + V.pageSize);

    if(!list.length){
      h += '<div class="tablewrap"><div class="empty">'
        + '<div class="ei">' + icon('inbox', 40) + '</div><h4>No campaigns match</h4>'
        + '<p>' + (V.q ? 'Nothing matches “' + esc(V.q) + '”' : 'No campaigns with status ' + V.status) + '.</p>'
        + '<button class="btn" onclick="resetSearch()">Reset filters</button>'
        + '</div></div>';
      CONTENT.innerHTML = h;
      return;
    }

    h += '<div class="tablewrap"><table class="ct">'
      + '<colgroup>' + COLS.map(function(c){ return '<col style="width:' + c.w + 'px">'; }).join('') + '</colgroup>'
      + '<thead><tr>'
      + COLS.map(function(c){
          if(!c.sortable) return '<th>' + c.label + '</th>';
          var cls = 'caret' + (V.sort === c.key ? ' ' + V.dir : '');
          return '<th class="sortable" onclick="sortBy(\'' + c.key + '\')"><span class="thin">' + c.label
            + '<span class="' + cls + '"><i class="up"></i><i class="dn"></i></span></span></th>';
        }).join('')
      + '</tr></thead><tbody>';

    page.forEach(function(c, i){
      var st     = statusOf(c);
      var orgs   = orgsOf(c.items);
      var promo  = promoLabels(c);
      var detail = 'campaign.html?id=' + encodeURIComponent(c.id);
      var edit   = 'create.html?id=' + encodeURIComponent(c.id);

      h += '<tr class="' + (st === 'ARCHIVED' ? 'archived' : '') + '">'
        + '<td class="num">' + (offset + i + 1) + '</td>'
        + '<td><a class="idlink" href="' + detail + '">' + esc(c.id) + '</a></td>'

        + '<td><a class="tname" href="' + detail + '">' + esc(c.name || 'Untitled campaign') + '</a></td>'

        + '<td>' + stText(st) + '</td>'
        + '<td class="nowrap num">' + (c.start ? fmtDate(c.start) : '<span class="dash">—</span>') + '</td>'
        + '<td class="nowrap num">' + (c.end   ? fmtDate(c.end)   : '<span class="dash">—</span>') + '</td>'
        + '<td class="num">' + c.items.length + '</td>'
        + '<td class="num nowrap">' + (!c.showGoal
            ? '<span class="dash" title="Total goal is hidden on the campaign page">hidden</span>'
            : totalGoal(c.items)
              ? fmtMoney(totalGoal(c.items))
              : '<span class="dash" title="No project in this campaign — events carry no goal">no goal</span>') + '</td>'
        + '<td class="num">' + orgs.length + '</td>'

        + '<td>' + (promo.length
            ? '<div class="tagrow">' + promo.map(function(p){
                return '<span class="tag blue">' + (p === 'Homepage hero' ? 'HERO' : 'BANNER') + '</span>';
              }).join('') + '</div>'
            : '<span class="dash">—</span>') + '</td>'

        + '<td>' + (c.spotlight ? '<span class="tag violet">ON</span>' : '<span class="dash">—</span>') + '</td>'
        + '<td class="nowrap">' + fmtAgo(c.updatedAt) + '</td>'

        + '<td><div class="rowacts">'
        +   '<button title="Publish view" onclick="publishView(\'' + c.id + '\')">' + icon('doc', 18) + '</button>'
        +   '<button title="View detail" onclick="location.href=\'' + detail + '\'">' + icon('eye', 18) + '</button>'
        +   '<button title="Edit" onclick="location.href=\'' + edit + '\'">' + icon('pencil', 18) + '</button>'
        +   '<button class="del" title="Delete" onclick="askDelete(\'' + c.id + '\')">' + icon('trash', 18) + '</button>'
        + '</div></td>'
        + '</tr>';
    });

    h += '</tbody></table></div>'
      + '<div class="tfoot">'
      +   '<span class="left">Showing ' + (offset + 1) + '–' + (offset + page.length) + ' of ' + list.length
      +     (list.length === all.length ? '' : ' (filtered from ' + all.length + ')')
      +     ' campaigns'
      +     '<button class="linkbtn" onclick="doReset()">Reset prototype data</button></span>'
      +   pager(totalPages)
      + '</div>';

    CONTENT.innerHTML = h;

    /* Wrapper is recreated on every render, so rebind its scroll listener. */
    CONTENT.querySelector('.tablewrap').addEventListener('scroll', updateScrollShadow);
    updateScrollShadow();
  }

  /* ----- actions ----- */
  /* Opens the public-facing campaign page. The front-end route is not part of
     this prototype — the BE dev wires it up during integration. */
  function publishView(id){
    var c = getCampaign(id);
    toast('Publish view → ' + (c.link || '/campaigns/' + c.id));
  }

  function askDelete(id){
    var c = getCampaign(id);
    V.delId = id;
    document.getElementById('delMsg').innerHTML =
      '<b>' + esc(c.name || 'Untitled campaign') + '</b> will be removed permanently. '
      + 'The ' + c.items.length + ' referenced project(s) / event(s) are not affected.';
    document.getElementById('delConfirm').onclick = function(){
      deleteCampaign(id);
      closeDelete();
      render();
      toast('“' + (c.name || 'Untitled campaign') + '” deleted');
    };
    document.getElementById('delOverlay').classList.add('show');
  }
  function closeDelete(){ V.delId = null; document.getElementById('delOverlay').classList.remove('show'); }

  function doReset(){ resetStore(); resetSearch(); toast('Seed data restored'); }

  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDelete(); });
  render();
</script>
</body>
</html>
