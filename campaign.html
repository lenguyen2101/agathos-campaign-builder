<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agathos Admin — Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div id="shell"></div>

<div class="overlay" id="delOverlay">
  <div class="modal">
    <div class="mh">
      <span class="mi err" id="delIcon"></span>
      <div>
        <h3>Delete campaign?</h3>
        <div class="mb" id="delMsg"></div>
      </div>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeDelete()">Cancel</button>
      <button class="btn solid-danger" id="delConfirm">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/mock-data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/shell.js"></script>
<script>
  var CONTENT = mountShell('campaign');
  document.getElementById('delIcon').innerHTML = icon('warn', 22);

  var C = null;
  function imgBroken(el){ el.parentNode.classList.add('broken'); }

  (function boot(){
    var id = new URLSearchParams(location.search).get('id');
    C = id ? getCampaign(id) : null;
    if(!C){
      CONTENT.innerHTML =
          '<div class="pagehead"><button class="back" onclick="location.href=\'index.html\'">' + icon('back', 20) + '</button>'
        + '<h1>Campaign not found</h1></div>'
        + '<div class="alert warn" style="margin:0 0 20px">' + icon('warn', 16) + '<span>'
        + (id ? 'No campaign with id <b>' + esc(id) + '</b> exists in the local store.' : 'No campaign id in the URL.')
        + '</span></div><a class="btn primary" href="index.html">Back to campaigns</a>';
      return;
    }
    document.title = 'Agathos Admin — ' + (C.name || 'Campaign');
    render();
  })();

  function editLink(step){ return 'create.html?id=' + encodeURIComponent(C.id) + '&step=' + step; }

  /* Read-only fields render as disabled inputs, matching the Event detail screen. */
  function ro(label, value, opts){
    opts = opts || {};
    var v = value == null ? '' : String(value);
    var ctl = opts.area
      ? '<textarea class="ctl" disabled>' + esc(v) + '</textarea>'
      : '<input class="ctl" type="text" disabled value="' + esc(v) + '">';
    return '<div class="field"><label>' + label + '</label>' + ctl + '</div>';
  }

  /* Read-only banner tile. Same box as the wizard's upload, minus the controls. */
  function shot(src, cls, emptyLabel){
    return '<div class="upload' + cls + '">'
      + (src
          ? '<img src="' + esc(src) + '" alt="" onerror="imgBroken(this)"><div class="fallback">' + esc(src) + '</div>'
          : '<div class="fallback" style="display:block">' + (emptyLabel || 'Not set') + '</div>')
      + '</div>'
      + (src ? '<div class="hint">' + esc(src) + '</div>' : '');
  }

  function block(step, title, inner){
    return '<div class="block"><div class="blockhead">'
      + '<span class="n">' + (step + 1) + '</span><h3>' + title + '</h3><span class="spacer"></span>'
      + '<a class="linkbtn" href="' + editLink(step) + '">Edit</a>'
      + '</div>' + inner + '</div>';
  }

  function render(){
    var st       = statusOf(C);
    var promo    = promoLabels(C);
    var featured = C.featured ? catItem(C.featured) : null;

    var h = '<div class="pagehead">'
      + '<button class="back" title="Back to campaigns" onclick="location.href=\'index.html\'">' + icon('back', 20) + '</button>'
      + '<h1>Campaign</h1>'
      + '<span class="meta">' + stText(st)
      +   ' · created ' + fmtDate(C.createdAt) + ' · updated ' + fmtAgo(C.updatedAt) + '</span>'
      + '<span class="spacer"></span>'
      + '<div class="acts">'
      +   '<button class="btn" onclick="publishView()">' + icon('doc', 16) + 'Publish view</button>'
      +   '<button class="btn dangerbtn" onclick="askDelete()">' + icon('trash', 16) + 'Delete</button>'
      +   '<a class="btn primary" href="' + editLink(0) + '">' + icon('pencil', 16) + 'Edit</a>'
      + '</div></div>';

    if(st === 'ARCHIVED'){
      h += '<div class="alert warn" style="margin:0 0 22px">' + icon('archive', 16)
        + '<span>This campaign is archived — it is hidden from every public surface. '
        + 'Change the status in <a class="linkbtn" href="' + editLink(0) + '">Basics</a> to bring it back.</span></div>';
    }

    h += '<div class="formcard">';

    /* 0 — Basics */
    h += block(0, 'Basics',
        '<div class="grid2">' + ro('ID', C.id) + ro('Status', st) + '</div>'
      + ro('Eyebrow', C.eyebrow)
      + ro('Campaign title', C.name)
      + ro('Subtitle', C.subtitle, {area:true})
      + '<div class="grid2">'
      +   '<div class="field"><label>Desktop banner · 1920×1080 (16:9)</label>' + shot(C.bannerDesktop, '') + '</div>'
      +   '<div class="field"><label>Mobile banner · 375×667 (9:16)</label>' + shot(C.bannerMobile, ' mob', 'Falls back to the desktop banner') + '</div>'
      + '</div>');

    /* 1 — Items */
    var itemsInner = '<div class="grid2">'
      + ro('Projects', countKind(C.items, 'project'))
      + ro('Events', countKind(C.items, 'event'))
      + '</div>'
      + ro('Campaign total goal', totalGoal(C.items)
          ? fmtMoney(totalGoal(C.items)) + ' — sum of the project goals below; events carry none'
          : 'No goal — this campaign has no project, and events carry no goal')
      ;

    if(!C.items.length){
      itemsInner += '<div class="alert neutral">' + icon('inbox', 16)
        + '<span>No items added yet — the landing page grid would be empty.</span></div>';
    } else {
      itemsInner += '<div class="field"><label>Items</label><div class="picklist">';
      C.items.forEach(function(id){
        var x = catItem(id);
        if(!x){
          /* A referenced item vanishing from the catalogue is a real data problem — show it. */
          itemsInner += '<div class="pickrow"><div class="thumb" style="background:var(--danger)"></div>'
            + '<div class="info"><div class="nm">Unknown item</div>'
            + '<div class="or">id ' + esc(id) + ' is not in the catalogue</div></div></div>';
          return;
        }
        itemsInner += '<div class="pickrow"><div class="thumb" style="background:' + x.c + '">'
          + '<img src="' + esc(x.img) + '" alt=""></div>'
          + '<div class="info"><div class="nm">' + esc(x.name) + '</div>'
          + '<div class="or">' + esc(x.org) + (x.goal ? ' · goal ' + fmtMoney(x.goal) : '') + '</div></div>'
          + (C.spotlight && C.featured === id ? '<span class="tag gold">FEATURED</span>' : '')
          + '<span class="tag ' + (x.kind === 'project' ? 'blue' : 'violet') + '">' + x.kind.toUpperCase() + '</span>'
          + '</div>';
      });
      itemsInner += '</div></div>';
    }
    h += block(1, 'Items', itemsInner);

    /* 2 — Schedule */
    h += block(2, 'Schedule',
        '<div class="grid2">'
      +   ro('Start date', C.start ? fmtDate(C.start) : '')
      +   ro('End date', C.end ? fmtDate(C.end) : '')
      + '</div>'
      + '<div class="hint" style="margin-top:-14px">Run window only — outside it every surface hides. Workflow state lives in Status.</div>');

    /* 3 — Display */
    h += block(3, 'Display',
        '<div class="grid2">'
      +   ro('Show total goal', C.showGoal ? 'ON' : 'OFF')
      +   ro('Total goal rendered', !C.showGoal
            ? '— hidden on the campaign page'
            : totalGoal(C.items)
              ? fmtMoney(totalGoal(C.items)) + ' — sum of ' + goalItemCount(C.items) + ' project goal(s)'
              : '— no project in this campaign, events carry no goal')
      + '</div>'
      + '<div class="grid2">'
      +   ro('Spotlight one item at a time', C.spotlight ? 'ON' : 'OFF')
      +   ro('Featured item', C.spotlight ? (featured ? featured.name : 'not set') : '')
      + '</div>');

    /* 4 — Promotion */
    h += block(4, 'Promotion',
        '<div class="grid2">'
      +   ro('Homepage hero slide', C.promoHero ? 'ON' : 'OFF')
      +   ro('In-project / event banner', C.promoBanner ? 'ON' : 'OFF')
      + '</div>'
      + '<div class="grid2">'
      +   ro('CTA label', C.promoHero ? C.ctaLabel : '')
      + '</div>');

    /* 5 — About */
    h += block(5, 'About this campaign', (C.aboutTitle || !richEmpty(C.aboutBody))
      ? ro('Heading', C.aboutTitle)
        /* aboutBody is rich text, so it renders rather than sitting in a textarea. */
        + '<div class="field"><label>Body</label><div class="rte-view">'
        + (richEmpty(C.aboutBody) ? '<span class="dash">empty</span>' : C.aboutBody) + '</div></div>'
      : '<div class="alert neutral">' + icon('inbox', 16)
        + '<span>No about block — the campaign page goes straight from the stats card to the item grid.</span></div>');

    h += '</div>';

    CONTENT.innerHTML = h;
  }

  /* Opens the public-facing campaign page. The front-end route is not part of
     this prototype — the BE dev wires it up during integration. */
  function publishView(){
    toast('Opens the public campaign page');
  }

  function askDelete(){
    document.getElementById('delMsg').innerHTML =
      '<b>' + esc(C.name || 'Untitled campaign') + '</b> will be removed permanently. '
      + 'The ' + C.items.length + ' referenced project(s) / event(s) are not affected.';
    document.getElementById('delConfirm').onclick = function(){
      deleteCampaign(C.id);
      location.href = 'index.html';
    };
    document.getElementById('delOverlay').classList.add('show');
  }
  function closeDelete(){ document.getElementById('delOverlay').classList.remove('show'); }

  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDelete(); });
</script>
</body>
</html>
