document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1.05;text-wrap:balance;\">Raise funds for your initiative. Keep your focus on the work.<\u002Fh2>\n      <p style=\"margin:0 0 30px;font-size:17px;line-height:1.6;color:rgba(255,255,255,.82);max-width:46ch;\">Churches, charities and community groups fundraise here. Payments, tax receipts and donor updates are handled for you. No platform fee.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;\">\n        <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:10px;background:#FFC838;color:#12275E;font-weight:800;font-size:16px;padding:16px 28px;border-radius:14px;box-shadow:0 12px 28px rgba(255,200,56,.3);\" style-hover=\"background:#FFD35C;color:#12275E;\">Start a project →<\u002Fa>\n        <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:16px;padding:16px 24px;border-radius:14px;border:1.5px solid rgba(255,255,255,.4);\" style-hover=\"background:rgba(255,255,255,.1);color:#fff;\">Talk to the team<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;\">\n        <span style=\"font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);\">Verified organisations only<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);\">Automatic tax receipts<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);\">Weekly payouts<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px;\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div data-reveal=\"\" style=\"display:flex;gap:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px;backdrop-filter:blur(4px);transition:background .2s;\" style-hover=\"background:rgba(255,255,255,.1);\">\n          <div style=\"flex:none;width:48px;height:48px;border-radius:50%;background:#FFC838;color:#12275E;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;\">{{ s.no }}<\u002Fdiv>\n          <div><h3 style=\"margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.015em;\">{{ s.title }}<\u002Fh3><p style=\"margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.78);\">{{ s.body }}<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FUNDED -->\n<section style=\"padding:clamp(70px,9vw,120px) 112px;background:#FFF4E1;\">\n  <div style=\"max-width:1216px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(30px,5vw,64px);align-items:center;\">\n    <div data-reveal=\"\" style=\"position:relative;\">\n      <div style=\"position:absolute;right:-18px;bottom:-18px;width:150px;height:150px;border-radius:50%;background:#FFC838;animation:floaty 6s ease-in-out infinite;\"><\u002Fdiv>\n      <div style=\"position:relative;aspect-ratio:4/3;border-radius:26px;background:linear-gradient(155deg,#7FA98A,#4C7A5C);overflow:hidden;box-shadow:0 30px 60px rgba(76,122,92,.25);\">\n        <div style=\"position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 10px,transparent 10px 22px);\"><\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 11px ui-monospace,Menlo,monospace;color:rgba(255,255,255,.85);background:rgba(0,0,0,.28);padding:4px 8px;border-radius:6px;\">team photo<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#2C50A8;margin-bottom:12px;\"><span style=\"width:22px;height:3px;border-radius:2px;background:#FFC838;\"><\u002Fspan>The team<\u002Fdiv>\n      <h2 style=\"margin:0 0 16px;font-size:clamp(30px,3.6vw,46px);font-weight:900;letter-spacing:-.035em;color:#12275E;line-height:1.08;text-wrap:balance;\">How agathos stays free for partners<\u002Fh2>\n      <p style=\"margin:0 0 22px;font-size:16.5px;line-height:1.65;color:#4B5563;\">We don't take a platform fee. agathos is run by a small team in Singapore and funded by optional love gifts: donors who choose to add a little on top of their gift.<\u002Fp>\n      <ul style=\"margin:0 0 28px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;\">\n        <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;color:#4B5563;\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#FFC838;color:#12275E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-top:2px;\">✓<\u002Fspan>Love gifts are optional and never taken from a donation<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;color:#4B5563;\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#FFC838;color:#12275E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-top:2px;\">✓<\u002Fspan>Partners keep what they raise, less payment processing<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.5;color:#4B5563;\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#FFC838;color:#12275E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-top:2px;\">✓<\u002Fspan>Every organisation is reviewed before it can fundraise<\u002Fli>\n      <\u002Ful>\n      <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:10px;background:#2C50A8;color:#fff;font-weight:700;font-size:16px;padding:15px 28px;border-radius:14px;box-shadow:0 10px 24px rgba(44,80,168,.25);\" style-hover=\"background:#12275E;color:#fff;\">Leave a love gift →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- VERSE -->\n<section style=\"padding:clamp(80px,10vw,130px) 112px;background:#2C50A8;color:#fff;text-align:center;position:relative;overflow:hidden;\"><div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,56,.28),rgba(255,200,56,0) 60%);pointer-events:none;\"><\u002Fdiv>\n  <span style=\"position:absolute;font-size:clamp(200px,30vw,420px);font-weight:900;color:rgba(255,255,255,.07);line-height:1;top:-60px;left:20px;font-family:Georgia,serif;\">“<\u002Fspan>\n  <div style=\"position:relative;max-width:820px;margin:0 auto;\" data-reveal=\"\">\n    <blockquote style=\"margin:0 0 26px;font-size:clamp(24px,3vw,38px);line-height:1.35;font-weight:700;letter-spacing:-.02em;text-wrap:balance;\">\"Truly I tell you, whatever you did for one of the least of these brothers and sisters of mine, you did for me.\"<\u002Fblockquote>\n    <div style=\"font-size:16px;font-weight:700;\">Jesus Christ<\u002Fdiv>\n    <div style=\"font-size:13.5px;opacity:.75;margin-top:4px;\">Matthew 25:40 (NIV)<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"padding:56px 112px 30px;background:#fff;\">\n  <div style=\"max-width:1216px;margin:0 auto;\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;\">\n      <div style=\"grid-column:span 1;\"><img src=\"ac368e3f-2b54-4ec7-babd-5c864daa86d3\" alt=\"agathos\" style=\"height:32px;width:auto;display:block;\"><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-top:8px;\">hello@agathos.be<\u002Fa><\u002Fdiv>\n      <div><h4 style=\"margin:0 0 12px;font-size:14px;font-weight:800;color:#12275E;\">Get Started<\u002Fh4><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">Host an Event<\u002Fa><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">Register an Organization<\u002Fa><\u002Fdiv>\n      <div><h4 style=\"margin:0 0 12px;font-size:14px;font-weight:800;color:#12275E;\">Connect &amp; Explore<\u002Fh4><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">Support a Cause<\u002Fa><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">Join an Event<\u002Fa><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">View Organizations<\u002Fa><\u002Fdiv>\n      <div><h4 style=\"margin:0 0 12px;font-size:14px;font-weight:800;color:#12275E;\">About Us<\u002Fh4><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">Our Story<\u002Fa><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">Our Team<\u002Fa><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">Advisory Board<\u002Fa><a href=\"#\" style=\"display:block;font-size:13.5px;color:#4B5563;margin-bottom:8px;\">How It Works<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin-top:40px;padding-top:20px;border-top:1px solid #EEF1F5;font-size:12.5px;color:#98A0AE;\"><span>Terms of Service<\u002Fspan><span>Privacy Policy<\u002Fspan><span>© 2026 Agathos Investments Pte Ltd<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroFocus&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;donor&quot;,&quot;organisation&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;'both'|'donor'|'organisation'&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  state = { raised: 750, charities: 100, fee: 0, counted: false, tick: 0 };\n  componentDidMount() {\n    const motion = false;\n    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));\n    const isDesk = () => window.innerWidth >= 900;\n    const applyDesk = () => document.querySelectorAll('[data-desk]').forEach(el => { el.style.display = isDesk() ? el.getAttribute('data-desk') : 'none'; });\n    applyDesk(); window.addEventListener('resize', applyDesk);\n    this._tick = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 3200);\n    const nav = document.querySelector('[data-nav]');\n    if (nav) window.addEventListener('scroll', () => { const on = window.scrollY > 20; nav.style.boxShadow = on ? '0 8px 30px rgba(18,39,94,.08)' : 'none'; }, { passive: true });\n    if (!motion || !('IntersectionObserver' in window)) return;\n    nodes.forEach(n => { n.style.opacity = '0'; n.style.transform = 'translateY(28px)'; n.style.transition = 'opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)'; });\n    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; io.unobserve(e.target); } }), { threshold: 0.12 });\n    nodes.forEach(n => io.observe(n));\n    // count-up for impact strip\n    this.setState({ raised: 0, charities: 0 });\n    const strip = nodes[0];\n    const cio = new IntersectionObserver(es => { if (es[0].isIntersecting && !this.state.counted) { this.setState({ counted: true }); this.count(); cio.disconnect(); } }, { threshold: 0.3 });\n    if (strip) cio.observe(strip); else this.count();\n  }\n  componentWillUnmount() { clearInterval(this._tick); }\n  count() {\n    const t0 = performance.now(), dur = 1600;\n    const tick = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);\n      this.setState({ raised: Math.round(750 * e), charities: Math.round(100 * e) });\n      if (p < 1) requestAnimationFrame(tick); };\n    requestAnimationFrame(tick);\n  }\n  renderVals() {\n    const focus = this.props.heroFocus ?? 'both';\n    const mk = (title, by, cat, loc, pct, n, bg, wide) => ({ title, by, cat, loc, pct, n, w: pct + '%', bg, wide: !!wide });\n    const ticks = [['Grace L.', '50'], ['Daniel T.', '120'], ['Mei Ling', '25'], ['Joshua K.', '200'], ['Sarah W.', '80']];\n    const tk = ticks[this.state.tick % ticks.length];\n    return {\n      tickName: tk[0], tickAmt: tk[1],\n      isBoth: focus === 'both', isDonor: focus === 'donor', isOrg: focus === 'organisation',\n      raised: this.state.raised, charities: this.state.charities, fee: this.state.fee,\n      projects: [\n        mk('A Bible Movement in Every Language', 'everylanguage', 'Missions & Evangelism', 'Dallas, US', 42, 31, 'linear-gradient(135deg,#7C5A3E,#C9A57A)'),\n        mk('Orphan Sunday 2025 with World Without Orphans', 'worldwithoutorphans', 'Children & Youth', 'Singapore', 67, 58, 'linear-gradient(135deg,#6F9A6B,#C8DDB8)', true),\n        mk('Living Waters Village', 'agathos', 'Community', 'Singapore', 83, 112, 'linear-gradient(135deg,#5A7FA8,#B8CCE0)'),\n      ],\n      ways: [\n        { no: '01', glyph: '♥', title: 'Give', body: 'Back a project once or monthly. Eligible gifts get a tax-deduction receipt the moment you give.', cta: 'Browse projects' },\n        { no: '02', glyph: '▦', title: 'Join', body: 'Conferences, camps, dinners and workshops run by partners across Singapore. Show up and be counted.', cta: 'See upcoming events' },\n        { no: '03', glyph: '◉', title: 'Follow', body: 'Every project reports how funds were used. Bookmark the ones you care about and watch what your gift became.', cta: 'How updates work' },\n      ],\n      steps: [\n        { no: '1', title: 'Tell us about your initiative', body: 'We review every organisation before it can fundraise. It is the reason donors trust what they find here.' },\n        { no: '2', title: 'Build your project page', body: 'Your story, your goal, your photos. Save a draft and come back whenever you need to.' },\n        { no: '3', title: 'Share it. We handle the rest.', body: 'Payments, receipts and donor updates are taken care of, and funds reach you weekly.' },\n      ],\n      stories: [\n        { when: 'Aug 2026', org: 'RISE People', big: '48 families', rest: 'now have clean water within walking distance.', bg: 'linear-gradient(140deg,#3B6C5A,#8FB8A0)', photo: 'well site photo', quote: \"We'd run fundraisers on our own for years. This was the first time strangers gave — people who found us through the platform, not through our church.\", who: 'Clean Water for Rural Families · 4 wells built' },\n        { when: 'Mar 2026', org: 'The Treasure Box', big: '1,200 children', rest: 'received devotional guides for their families.', bg: 'linear-gradient(135deg,#A8402F,#E08A5C)', photo: 'children with guides', quote: 'The campaign closed at 110% of goal. We printed a second run with the surplus.', who: 'Treasure Box Singapore · Families' },\n        { when: 'Dec 2025', org: 'Antioch21', big: '200 campers', rest: 'registered without a single payment chased by hand.', bg: 'linear-gradient(135deg,#2C50A8,#5D9BE0)', photo: 'youth camp photo', quote: 'First time in our history the team spent camp week with the youth instead of with a spreadsheet.', who: 'Antioch21 · Youth camp' },\n      ],\n      logos: ['ANTIOCH21', 'YWAM', 'N5', 'SG500', 'RISE People', 'Treasure Box', 'World Without Orphans', 'everylanguage', 'ANTIOCH21', 'YWAM', 'N5', 'SG500', 'RISE People', 'Treasure Box', 'World Without Orphans', 'everylanguage'],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
